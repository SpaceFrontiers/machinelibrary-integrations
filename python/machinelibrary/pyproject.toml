[project]
name = "machinelibrary"
version = "0.1.0"
description = "Python client for Machine Library: citable search over papers, books, patents, standards and Wikipedia for AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["machine-library", "scholarly-search", "rag", "retrieval", "citations", "ai-agents"]

[project.urls]
Homepage = "https://machinelibrary.ai"
Documentation = "https://machinelibrary.ai/docs/api"
Repository = "https://github.com/SpaceFrontiers/machinelibrary-integrations"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
